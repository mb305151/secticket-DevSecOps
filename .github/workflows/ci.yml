name: SecTicket DevSecOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testy i migracje SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Uruchom testy pytest
        run: ./test.sh

      - name: Zbuduj obraz produkcyjny
        run: docker build --target runtime -t secticket:ci .

      - name: Sprawdz migracje na pustej bazie SQLite
        run: |
          docker run --rm -i \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DATABASE_PATH=/tmp/ci-schema.db \
            -e SECRET_KEY=ci-only-dummy-secret-not-for-production \
            --entrypoint sh secticket:ci -s <<'SH'
          set -eu

          flask --app 'app:create_app()' db upgrade

          python - <<'PY'
          from sqlalchemy import inspect
          from app import create_app
          from app.extensions import db

          app = create_app()

          with app.app_context():
              tables = set(inspect(db.engine).get_table_names())

              expected = {
                  "users",
                  "tickets",
                  "comments",
                  "rate_limit_buckets",
                  "security_events",
              }

              missing = expected - tables
              assert not missing, f"Brak tabel: {missing}"

              print("[OK] Migracje SQLite zaliczone")
          PY
          SH

  security:
    name: SAST i audyt zaleznosci
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Przygotuj Python 3.13
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Zainstaluj narzedzia skanujace
        run: |
          python -m pip install \
            "bandit==1.9.4" \
            "pip-audit==2.10.1"

      - name: SAST - Bandit
        run: bandit -r app -ll -ii

      - name: SCA - pip-audit
        run: python -m pip_audit -r requirements.txt


  container_scan:
    name: Skan obrazu Docker - Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Zbuduj obraz produkcyjny
        run: docker build --target runtime -t secticket:scan .

      - name: Trivy - pelny raport podatnosci
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secticket:scan
          version: 'v0.74.0'
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: 'false'
          trivyignores: .github/trivy/no-exceptions
          cache: 'false'

      - name: Sprawdz zalozenia wyjatkow SQLite
        run: |
          docker run --rm -i \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e DATABASE_PATH=/tmp/sqlite-check.db \
            -e SECRET_KEY=ci-only-dummy-secret \
            --entrypoint python secticket:scan - <<'PYCODE'
          import shutil
          from sqlalchemy import text
          from app import create_app
          from app.extensions import db

          assert shutil.which("sqlite3") is None

          app = create_app()
          with app.app_context():
              db.create_all()
              tables = db.session.execute(text(
                  "SELECT name FROM sqlite_master "
                  "WHERE type='table' "
                  "AND upper(sql) LIKE '%USING FTS5%'"
              )).all()
              assert not tables, tables

          print("[OK] Zalozenia wyjatkow SQLite zachowane")
          PYCODE

      - name: Trivy - blokuj niezaakceptowane HIGH i CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secticket:scan
          version: 'v0.74.0'
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: 'false'
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: 'true'
          cache: 'false'
