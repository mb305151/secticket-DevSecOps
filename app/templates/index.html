{% extends "base.html" %}

{% block content %}
<section class="card">
    <h1>SecTicket</h1>

    <p>
        System zarzadzania zgloszeniami usterek.
    </p>

    {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}">
            Przejdz do panelu
        </a>
    {% else %}
        <a href="{{ url_for('auth.register') }}">
            Utworz konto
        </a>
    {% endif %}
</section>
{% endblock %}
