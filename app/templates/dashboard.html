{% extends "base.html" %}

{% block content %}
<section class="card">
    <h1>Panel SecTicket</h1>

    <p>
        Zalogowano jako:
        <strong>{{ user.username }}</strong>
    </p>

    <p>Rola: {{ user.role }}</p>

    <h2>Zarzadzanie zgloszeniami</h2>

    <p>Przegladaj i obsluguj zgloszenia usterek.</p>

    <p>
        <a class="action-link"
           href="{{ url_for('tickets.list_tickets') }}">
            Przejdz do zgloszen
        </a>
    </p>
</section>
{% endblock %}
